<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Boarding в ProSafe — Отчёты и аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="reports">
<div class="app">
  <aside id="aside"></aside>
  <main id="view" tabindex="-1">
    <div class="topbar"><div><h1>Отчёты и аналитика</h1><div class="hint">Показатели считаются из данных системы</div></div>
      <div class="actions topbar-actions"><button class="btn btn-ghost" onclick="goBack()">← Назад</button><a class="btn" href="home.html">Главная</a></div></div>

    <div class="report-overview">
      <div class="report-summary">
        <div class="report-summary-head">
          <div>
            <div class="history-eyebrow">Сводка</div>
            <h2>Операционный обзор HR</h2>
          </div>
          <span class="pill lime">За последние 30 дней</span>
        </div>
        <div id="rep-dashboard" class="grid report-grid"></div>
      </div>
      <aside class="report-side">
        <h3>Что важно сейчас</h3>
        <div id="rep-alerts" class="report-alerts"></div>
      </aside>
    </div>

    <div class="report-downloads">
      <div class="report-summary-head">
        <div>
          <div class="history-eyebrow">Выгрузки</div>
          <h2>Скачать отчёты</h2>
        </div>
      </div>
      <div id="rep-downloads" class="report-download-grid"></div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
