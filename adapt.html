<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Boarding в ProSafe — Управление адаптацией</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="adapt">
<div class="app">
  <aside id="aside"></aside>
  <main id="view" tabindex="-1">
    <div class="topbar"><div><h1>Управление адаптацией</h1></div>
      <div class="actions" style="margin:0"><button class="btn btn-ghost" onclick="history.back()">← Назад</button><a class="btn" href="home.html">Главная</a></div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="list">Сотрудники и прогресс</button><button class="tab" role="tab" data-tab="plan">План адаптации</button></div>
    <section data-panel="list" hidden>
    <div class="note">Прогресс: задачи 60%, ознакомление с документами 20%, опросы 10%, время в 60 днях 10%.</div>
    <div id="adapt-table"></div>
    </section>
    <section data-panel="plan" hidden>
    <div class="note">Шаблоны планов адаптации задаются по должностям и используются как базовый сценарий для новых сотрудников.</div>

    <label for="plan-pos">Должность</label>
    <select id="plan-pos" style="max-width:420px" onchange="renderPositionPlan()"></select>
    <div class="actions" style="margin:12px 0 0">
      <button class="btn btn-primary" type="button" onclick="openPlanTaskEditor()">Добавить задачу в шаблон</button>
    </div>
    <div id="plan-template-list" style="margin-top:16px"></div>

    <div style="margin-top:24px">
      <label for="plan-emp">Сотрудник</label>
      <select id="plan-emp" style="max-width:420px" onchange="renderPlanTable(this.value)"></select>
      <div id="plan-table" style="margin-top:16px"></div>
    </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
