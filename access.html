<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Boarding в ProSafe — Доступы и настройки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="access">
<div class="app">
  <aside id="aside"></aside>
  <main id="view" tabindex="-1">
    <div class="topbar"><div><h1>Доступы и настройки</h1></div>
      <div class="actions" style="margin:0"><button class="btn btn-ghost" onclick="history.back()">← Назад</button><a class="btn" href="home.html">Главная</a></div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="dash">Дашборд</button><button class="tab" role="tab" data-tab="users">Пользователи</button><button class="tab" role="tab" data-tab="rights">Права</button></div>
    <section data-panel="dash" hidden>
    <div class="grid">
      <div class="card"><div class="num" id="acc-total">0</div><div class="lbl">Учётных записей</div></div>
      <div class="card"><div class="num" id="acc-active">0</div><div class="lbl">Активных</div></div>
      <div class="card"><div class="num" id="acc-blocked">0</div><div class="lbl">Заблокированных</div></div>
      <div class="card"><div class="num" id="acc-errors">0</div><div class="lbl">Ошибок в системе за сутки</div></div>
    </div>
    </section>
    <section data-panel="users" hidden>
<div class="actions"><button class="btn btn-primary" onclick="openUser()">Добавить пользователя</button></div>    <div id="users-table"></div>
    </section>
    <section data-panel="rights" hidden>
    <div class="card" style="max-width:520px"><h3>Роли</h3><p class="hint">Выберите роли галочкой. Серверная проверка прав — этап 2.</p>
      <label class="check"><input type="checkbox" checked> HR</label>
      <label class="check"><input type="checkbox" checked> Сотрудник</label>
      <label class="check"><input type="checkbox" checked> Руководитель</label>
      <label class="check"><input type="checkbox"> Администратор</label>
      <div class="actions" style="margin-top:16px"><button class="btn btn-primary" onclick="toast('Права сохранены')">Сохранить</button></div>
    </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
