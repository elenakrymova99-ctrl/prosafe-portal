<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Boarding в ProSafe — Сотрудники и должности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="staff">
<div class="app">
  <aside id="aside"></aside>
  <main id="view" tabindex="-1">
    <div class="topbar"><div><h1>Сотрудники и должности</h1></div>
      <div class="actions topbar-actions"><button class="btn btn-ghost" onclick="goBack()">← Назад</button><a class="btn" href="home.html">Главная</a></div></div>
    <div class="card staff-search-card">
      <label for="staff-global-q">Поиск по сотрудникам и должностям</label>
      <input id="staff-global-q" oninput="renderStaffSearch(this.value)" placeholder="ФИО, должность, отдел, направление">
    </div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="staff">Сотрудники</button><button class="tab" role="tab" data-tab="positions">Должности</button><button class="tab" role="tab" data-tab="bulk">Загрузка списками</button></div>
    <section data-panel="staff" hidden>
    <div class="actions content-actions"><button class="btn btn-primary" onclick="openCreateEmployee()">Создать сотрудника</button></div>
    <div id="staff-table" class="staff-table"></div>
    </section>
    <section data-panel="positions" hidden>
    <div class="actions content-actions"><button class="btn btn-primary" onclick="openPositionDialog('', PAGE_RENDER)">Создать должность</button></div>
    <div id="positions-table" class="staff-table"></div>
    <p class="hint">Шаблон адаптации должности появится в карточке должности (следующий шаг).</p>
    </section>
    <section data-panel="bulk" hidden>
    <div class="cols"><div class="card"><h3>Сотрудники</h3><div class="actions bulk-actions"><button class="btn" disabled>Скачать шаблон</button><button class="btn" disabled>Загрузить</button></div><p class="hint">Загрузка Excel — этап 2, шаблон от заказчика не получен.</p></div><div class="card"><h3>Должности</h3><div class="actions bulk-actions"><button class="btn" disabled>Скачать шаблон</button><button class="btn" disabled>Загрузить</button></div><p class="hint">Загрузка Excel — этап 2.</p></div></div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
